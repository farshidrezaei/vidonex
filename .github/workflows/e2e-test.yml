name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-test:
    name: E2E Tests (FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install FFmpeg & FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Download dependencies
        run: go mod download

      - name: Run E2E tests with race detector
        run: >-
          go test
          -race
          -v
          -timeout=180s
          ./tests/e2e/...
