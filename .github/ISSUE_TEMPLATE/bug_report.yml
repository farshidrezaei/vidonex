name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in Vidonex.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue and improve Vidonex!
  - type: input
    id: version
    attributes:
      label: Vidonex Version
      description: What version of Vidonex are you using? (e.g. `vidonex version` or git commit)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Manjaro/Fedora)
        - macOS (Apple Silicon M-series)
        - macOS (Intel x86_64)
        - Windows 10/11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal specification / code to reproduce the behavior.
      placeholder: |
        1. Create project with...
        2. Run `vidonex render ...`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant logs from terminal or developer tools.
      render: shell
