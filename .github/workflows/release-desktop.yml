name: Release Desktop Workstation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Build Linux Desktop (AppImage & deb) ──────────────────────────────────
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package.json'

      - name: Build Web Studio Frontend
        working-directory: ui
        run: |
          npm ci
          npm run generate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Linux Binary
        run: |
          go build -trimpath -tags webkit2_41 -ldflags="-s -w" -o build/bin/vidonyx-linux-amd64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidonyx-linux-amd64
          path: build/bin/vidonyx-linux-amd64
          retention-days: 7

  # ─── Build Windows Desktop (NSIS & exe) ───────────────────────────────────
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Studio Frontend
        working-directory: ui
        run: |
          npm ci
          npm run generate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Windows Binary
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui" -o build/bin/vidonyx-windows-amd64.exe .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidonyx-windows-amd64.exe
          path: build/bin/vidonyx-windows-amd64.exe
          retention-days: 7

  # ─── Build macOS Desktop (Universal Binary & .app) ────────────────────────
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Studio Frontend
        working-directory: ui
        run: |
          npm ci
          npm run generate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build macOS ARM64
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/bin/vidonyx-darwin-arm64 .

      - name: Build macOS AMD64
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/bin/vidonyx-darwin-amd64 .

      - name: Create macOS Universal Binary
        run: |
          lipo -create -output build/bin/vidonyx-darwin-universal build/bin/vidonyx-darwin-arm64 build/bin/vidonyx-darwin-amd64
          chmod +x build/bin/vidonyx-darwin-universal

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidonyx-darwin-universal
          path: build/bin/vidonyx-darwin-universal
          retention-days: 7
