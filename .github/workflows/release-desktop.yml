name: Release Vidonex (Desktop & CLI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ─── Build Linux (Desktop + CLI) ──────────────────────────────────────────
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Build Web Studio Frontend
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Desktop Binary
        run: |
          go build -trimpath -tags "production,webkit2_41" -ldflags="-s -w" -o build/bin/vidonex-linux-amd64 .

      - name: Build Headless CLI Binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/bin/vidonex-cli-linux-amd64 ./cmd/vidonex

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidonex-linux-artifacts
          path: |
            build/bin/vidonex-linux-amd64
            build/bin/vidonex-cli-linux-amd64
          retention-days: 7

  # ─── Build Windows (Desktop + CLI) ────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Build Web Studio Frontend
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Desktop Binary
        run: |
          go build -trimpath -tags production -ldflags="-s -w -H windowsgui" -o build/bin/vidonex-windows-amd64.exe .

      - name: Build Headless CLI Binary
        run: |
          go build -trimpath -ldflags="-s -w" -o build/bin/vidonex-cli-windows-amd64.exe ./cmd/vidonex

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidonex-windows-artifacts
          path: |
            build/bin/vidonex-windows-amd64.exe
            build/bin/vidonex-cli-windows-amd64.exe
          retention-days: 7

  # ─── Build macOS (Desktop + CLI Universal) ────────────────────────────────
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Build Web Studio Frontend
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Desktop macOS ARM64 & AMD64
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -tags production -ldflags="-s -w" -o build/bin/vidonex-darwin-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -tags production -ldflags="-s -w" -o build/bin/vidonex-darwin-amd64 .
          lipo -create -output build/bin/vidonex-darwin-universal build/bin/vidonex-darwin-arm64 build/bin/vidonex-darwin-amd64
          chmod +x build/bin/vidonex-darwin-universal

      - name: Build Headless CLI macOS ARM64 & AMD64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/bin/vidonex-cli-darwin-arm64 ./cmd/vidonex
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/bin/vidonex-cli-darwin-amd64 ./cmd/vidonex
          lipo -create -output build/bin/vidonex-cli-darwin-universal build/bin/vidonex-cli-darwin-arm64 build/bin/vidonex-cli-darwin-amd64
          chmod +x build/bin/vidonex-cli-darwin-universal

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidonex-macos-artifacts
          path: |
            build/bin/vidonex-darwin-universal
            build/bin/vidonex-cli-darwin-universal
          retention-days: 7

  # ─── Publish GitHub Release ───────────────────────────────────────────────
  publish-release:
    name: Publish Release Assets & Checksums
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
